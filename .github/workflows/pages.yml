name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # hashFiles() is only valid in step-level `if:` — not job-level.
  # Gate deploy until website/ exists in the repo.
  check:
    runs-on: ubuntu-latest
    outputs:
      has_website: ${{ steps.check.outputs.has_website }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Check for website package-lock
        run: |
          if [ -f website/package-lock.json ]; then
            echo "has_website=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_website=false" >> "$GITHUB_OUTPUT"
            echo "No website/package-lock.json — skipping Pages deploy"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.has_website == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
